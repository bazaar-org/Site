<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/output.css" rel="stylesheet">
    <link rel="icon" href="/favicon.ico">
    <title>Support - Bazaar</title>
</head>

<body class="bg-[#f6f5f4] text-[#2e3436] dark:bg-[#1d1d20] dark:text-[#ffffff] antialiased">
    <div>

        <!-- Background -->

        <div
            class="bg-gradient-to-br from-[#FF7A6C] from-[62%] to-[#D45B61] to-[81%]  overflow-hidden relative h-[100vh] md:h-[100vh] flex flex-col hidden md:block">
            <div class="absolute inset-0 opacity-7"
                style="background-image: url('/assets/header-background.svg'); background-repeat: repeat; background-size: auto 200px; transform: rotate(-15deg) scale(2);">
            </div>

        </div>

        <!-- Content -->

        <div class="absolute md:inset-0 inset flex" style="justify-content: center; align-items: center;">
            <div
                class="flex flex-col items-center font-semibold px-8 py-12 text-center md:shadow-lg xl:rounded-4xl h-fit w-full xl:w-fit  transition bg-white dark:bg-[#2e2e32]">
                <img src="/assets/heart-filled-symbolic.svg"
                    class="w-10 h-10 dark:invert dark:brightness-0 dark:invert justify-center mb-8 mx-auto"
                    alt="Heart shaped object">
                <h1 class="text-4xl font-extrabold tracking-tight mb-1">
                    Support Bazaar</h1>
                <p class="text-lg text-[#77767b] dark:text-[#9a9996] max-w-xl mx-auto mb-8">
                    Support the devs and keep Bazaar alive
                </p>
                <div class="flex flex-row gap-8 justify-center flex-wrap">

                    <!-- Eva links -->

                    <div>
                        <img src="https://avatars.githubusercontent.com/u/113054217?v=4"
                            class="rounded-full mb-5 w-48 mx-auto">
                        <p class="text-3xl font-bold tracking-tight mb-5">Kolunmi</p>

                        <div class="flex gap-4 justify-center flex-wrap">
                            <a href="https://github.com/sponsors/kolunmi"
                                class="inline-flex items-center gap-2 bg-[#000000] text-white font-semibold px-8 py-3 rounded-full transition border-4 border-[#000000] hover:shadow-[0_0_0_4px_#000000,inset_0_0_0_4px_#000000] dark:invert">
                                Sponsor on Github
                                <img src="/assets/GitHub_Invertocat_White.svg" class="w-8 ml-3">
                            </a>
                            <a href="https://ko-fi.com/kolunmi"
                                class="inline-flex items-center gap-2 bg-[#FF5A16] text-white font-semibold px-8 py-3 rounded-full transition border-4 border-[#FF5A16] hover:shadow-[0_0_0_4px_#FF5A16,inset_0_0_0_4px_#FF5A16]">
                                Send a tip on Ko-Fi
                                <img src="/assets/kofi_symbol.png" class="w-8 ml-3">
                            </a>
                        </div>
                    </div>

                    <!-- Alex links -->

                    <div>
                        <img src="https://avatars.githubusercontent.com/u/160625516?v=4"
                            class="rounded-full mb-5 w-48 mx-auto">
                        <p class="text-3xl font-bold tracking-tight mb-5">Alexander Vanhee</p>

                        <div class="flex gap-4 justify-center flex-wrap">
                            <a href="https://github.com/sponsors/AlexanderVanhee"
                                class="inline-flex items-center gap-2 bg-[#000000] text-white font-semibold px-8 py-3 rounded-full transition border-4 border-[#000000] hover:shadow-[0_0_0_4px_#000000,inset_0_0_0_4px_#000000] dark:invert">
                                Sponsor on Github
                                <img src="/assets/GitHub_Invertocat_White.svg" class="w-8 ml-3">
                            </a>
                            <a href=" https://ko-fi.com/alexandervanhee"
                                class="inline-flex items-center gap-2 bg-[#FF5A16] text-white font-semibold px-8 py-3 rounded-full transition border-4 border-[#FF5A16] hover:shadow-[0_0_0_4px_#FF5A16,inset_0_0_0_4px_#FF5A16]">
                                Send a tip on Ko-Fi
                                <img src="/assets/kofi_symbol.png" class="w-8 ml-3">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>



</html>
